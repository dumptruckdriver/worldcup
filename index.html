document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

"font-family:Archivo;font-weight:800;font-size:12px;letter-spacing:3px;text-transform:uppercase;color:#FBD66B\">2026 · USA · Canada · Mexico<\u002Fdiv>\n    <h1 style=\"font-family:Archivo;font-weight:900;font-style:italic;font-size:clamp(32px,7vw,64px);line-height:.92;letter-spacing:-1px;text-transform:uppercase;margin:8px 0 0;color:#fff;text-shadow:0 4px 16px rgba(0,0,0,.4)\">World Cup <span style=\"color:#FBD66B\">Bracket<\u002Fspan><\u002Fh1>\n    <div style=\"height:5px;width:min(460px,76%);margin:14px auto 0;border-radius:6px;background:linear-gradient(90deg,#0E5A34,#FBD66B 55%,#E0A92A);box-shadow:0 2px 12px rgba(0,0,0,.4)\"><\u002Fdiv>\n    <div style=\"margin-top:13px;font-size:13px;font-weight:600;color:#bfe0cd\">32 knockout matches · all kickoffs in U.S. Central Time<\u002Fdiv>\n\n    <div style=\"display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap;margin-top:18px\">\n      <span style=\"display:inline-flex;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);border-radius:999px;padding:4px\">\n        <button onclick=\"{{ onTabBracket }}\" style=\"{{ bracketTabStyle }}\">Bracket<\u002Fbutton>\n        <button onclick=\"{{ onTabList }}\" style=\"{{ listTabStyle }}\">Game List<\u002Fbutton>\n      <\u002Fspan>\n      <button onclick=\"{{ onRefresh }}\" style=\"font-family:Archivo;font-weight:800;font-size:12px;letter-spacing:.4px;text-transform:uppercase;background:#FBD66B;color:#143a25;border:0;border-radius:999px;padding:9px 17px;cursor:pointer;box-shadow:0 2px 10px rgba(0,0,0,.25)\">Refresh<\u002Fbutton>\n      <span style=\"{{ statusPillStyle }}\">\n        <sc-if value=\"{{ statusOk }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"width:8px;height:8px;border-radius:50%;background:#5dffb0;display:inline-block;animation:wcPulse 1.7s infinite\"><\u002Fspan><\u002Fsc-if>\n        {{ statusText }}\n      <\u002Fspan>\n    <\u002Fdiv>\n\n    <div style=\"display:flex;gap:18px;justify-content:center;flex-wra c.matchLabel }}<\u002Fspan>\n                    <span style=\"display:inline-flex;align-items:center;gap:5px\">\n                      <sc-if value=\"{{ c.isLive }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"width:7px;height:7px;border-radius:50%;background:#0E5A34;display:inline-block;animation:wcPulse 1.6s infinite\"><\u002Fspan><\u002Fsc-if>\n                      {{ c.badge }}\n                    <\u002Fspan>\n                  <\u002Fdiv>\n                  <sc-if value=\"{{ c.showTrophy }}\" hint-placeholder-val=\"{{ false }}\">\n                    <div style=\"{{ c.finalTitleStyle }}\">★ World Cup Final ★<\u002Fdiv>\n                  <\u002Fsc-if>\n                  <div onclick=\"{{ c.rowA.onClick }}\" style=\"{{ c.rowA.rowStyle }}\" style-hover=\"{{ c.rowA.hoverStyle }}\">\n                    <sc-if value=\"{{ c.rowA.hasFlag }}\" hint-placeholder-val=\"{{ false }}\"><img src=\"{{ c.rowA.flagUrl }}\" style=\"{{ c.rowA.flagStyle }}\"><\u002Fsc-if>\n                    <sc-if value=\"{{ c.rowA.showBlank }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"{{ c.rowA.blankStyle }}\"><\u002Fspan><\u002Fsc-if>\n                    <span style=\"{{ c.rowA.nameStyle }}\">{{ c.rowA.name }}<\u002Fspan>\n                    <span style=\"{{ c.rowA.scoreStyle }}\">{{ c.rowA.scoreText }}<\u002Fspan>\n                  <\u002Fdiv>\n                  <div onclick=\"{{ c.rowB.onClick }}\" style=\"{{ c.rowB.rowStyle }}\" style-hover=\"{{ c.rowB.hoverStyle }}\">\n                    <sc-if value=\"{{ c.rowB.hasFlag }}\" hint-placeholder-val=\"{{ false }}\"><img src=\"{{ c.rowB.flagUrl }}\" style=\"{{ c.rowB.flagStyle }}\"><\u002Fsc-if>\n                    <sc-if value=\"{{ c.rowB.showBlank }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"{{ c.rowB.blankStyle }}\"><\u002Fspan><\u002Fsc-if>\n                    <span style=\"{{ c.rowB.nameStyle }}\">{{ c.rowB.name }}<\u002Fspan>\n                    <span style=\"{{ c.rowB.scoreStyle }}\">{{ c.rowB.sco -size:12px;color:#5b6b8c;font-weight:600;',\n      timeStyle:'color:#0E5A34;font-weight:800;', venue:m.venue, time:tm\n    };\n  }\n\n  buildDayGroups(R){\n    const groups=[]; let cur=null;\n    const dayStyle='font-family:Archivo;font-weight:800;color:#FBD66B;font-size:15px;letter-spacing:.6px;padding:4px 2px 8px;text-transform:uppercase;text-shadow:0 1px 3px rgba(0,0,0,.5);';\n    this.LISTORDER.forEach((no)=>{\n      const m=R[no], day=m.time.split(' · ')[0];\n      if(!cur||cur.day!==day){ cur={day, dayStyle, rows:[]}; groups.push(cur); }\n      cur.rows.push(this.buildListCard(no,R));\n    });\n    return groups;\n  }\n\n  /* ---- connector wires ---- */\n  drawWires(){\n    if(this.props.showWires===false){ var w0=document.getElementById('wcWires'); if(w0)w0.innerHTML=''; return; }\n    var bracket=document.getElementById('wcBracket'), wires=document.getElementById('wcWires');\n    if(!bracket||!wires) return;\n    var br=bracket.getBoundingClientRect(), W=bracket.scrollWidth, H=bracket.offsetHeight;\n    wires.setAttribute('width',W); wires.setAttribute('height',H); wires.setAttribute('viewBox','0 0 '+W+' '+H);\n    var box=(el)=>{ var r=el.getBoundingClientRect(); return {l:r.left-br.left,r:r.right-br.left,cy:r.top-br.top+r.height/2}; };\n    var paths='';\n    Object.keys(this.CONN).forEach((child)=>{\n      var c=document.getElementById('m'+child); if(!c) return; var cb=box(c);\n      this.CONN[child].forEach((p)=>{\n        var pe=document.getElementById('m'+p); if(!pe) return; var pb=box(pe), sx, ex, ey=cb.cy, sy=pb.cy;\n        if(pb.r<=cb.l){sx=pb.r;ex=cb.l;}else{sx=pb.l;ex=cb.r;}\n        var mx=(sx+ex)/2;\n        paths+='<path d=\"M'+sx+' '+sy+' H'+mx+' V'+ey+' H'+ex+'\" fill=\"none\" stroke=\"rgba(251,214,107,.5)\" stroke-width=\"2.5\"/>';\n      });\n    });\n    wires.innerHTML=paths;\n  }\n  scheduleWires(){ requestAnimationFrame(()=>requestAnimationFrame(()=>this.drawWires())); }\n\n  tabStyle(on){\n    return `font-family:Archivo;font-weight:800;font-size:12.5px;letter-spacing:.4px;border:0;padding:8px 18px;border-radius:999px;cursor:pointer;text-transform:uppercase;transition:all .15s;${on?'background:#FBD66B;color:#143a25;box-shadow:0 2px 10px rgba(0,0,0,.25);':'background:transparent;color:#cfe9da;'}`;\n  }\n\n  renderVals(){\n    const R=this.computeResults();\n    const isBracket=this.state.view==='bracket';\n    const ok=this.state.statusOk;\n    return {\n      bracketDisplay: isBracket?'block':'none',\n      listDisplay: isBracket?'none':'block',\n      bracketTabStyle: this.tabStyle(isBracket),\n      listTabStyle: this.tabStyle(!isBracket),\n      onTabBracket: ()=>this.setView('bracket'),\n      onTabList: ()=>this.setView('list'),\n      onRefresh: ()=>this.refresh(),\n      statusOk: ok,\n      statusText: this.state.statusText,\n      statusPillStyle: `display:inline-flex;align-items:center;gap:7px;font-family:Manrope;font-weight:700;font-size:12px;padding:8px 14px;border-radius:999px;color:${ok?'#eafff5':'#ffd9d9'};background:rgba(0,0,0,.28);border:1px solid ${ok?'rgba(93,255,176,.35)':'rgba(255,150,150,.3)'};`,\n      columns: this.buildColumns(R),\n      dayGroups: this.buildDayGroups(R)\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
